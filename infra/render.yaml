services:
  - type: web
    name: knowetrade-api
    runtime: python
    plan: starter
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: knowetrade-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r apps/worker/requirements.txt
    # Scheduled trading jobs run via Render crons below. Idle until a long-running task is needed.
    startCommand: python -c "import time; print('knowetrade-worker idle; use Render crons for scheduled jobs.'); time.sleep(10**9)"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_MODE
        value: paper

  - type: cron
    name: knowetrade-premarket
    runtime: python
    plan: starter
    schedule: "30 13 * * 1-5"
    buildCommand: pip install -r apps/worker/requirements.txt
    startCommand: python -c "from apps.worker.main import run_premarket_health_check_job; run_premarket_health_check_job()"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_NOTIFY_MODE
        value: trades_only
      - key: APP_MODE
        value: paper
      - key: TRADING_ENABLED
        value: "true"
      - key: ENABLE_ORDER_SUBMISSION
        value: "false"
      - key: WORKER_JOB_NAME
        value: premarket_health_check

  - type: cron
    name: knowetrade-morning-cycle
    runtime: python
    plan: starter
    schedule: "0 15 * * 1-5"
    buildCommand: pip install -r apps/worker/requirements.txt
    startCommand: python -c "from apps.worker.main import run_intraday_trading_workflow_job; run_intraday_trading_workflow_job()"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_NOTIFY_MODE
        value: trades_only
      - key: APP_MODE
        value: paper
      - key: TRADING_ENABLED
        value: "true"
      - key: ENABLE_ORDER_SUBMISSION
        value: "true"
      - key: RISK_APPETITE
        value: ultra_aggressive
      - key: PORTFOLIO_STRATEGY
        value: momentum_rotation
      - key: MOMENTUM_LOOKBACK_DAYS
        value: "20"
      - key: ORDER_SIZING_MODE
        value: equity_weighted
      - key: MAX_OPEN_POSITIONS
        value: "20"
      - key: MAX_PORTFOLIO_POSITIONS
        value: "20"
      - key: MAX_POSITION_PCT
        value: "0.30"
      - key: PAPER_ORDER_QTY
        value: "5"
      - key: MAX_POSITION_NOTIONAL_USD
        value: "50000"
      - key: WORKER_JOB_NAME
        value: intraday_trading_workflow

